services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: zones
      POSTGRES_USER: zones
      POSTGRES_PASSWORD: zones_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zones -d zones"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
