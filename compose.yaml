services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: zones
      POSTGRES_USER: zones
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zones_dev_only}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zones -d zones"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    # One active replica is required by D-20; do not scale this service horizontally.
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:postgresql://db:5432/zones
      DB_USER: zones
      DB_PASSWORD: ${DB_PASSWORD:-zones_dev_only}
      JWT_SECRET: ${JWT_SECRET:-bW92ZWluc3luYy1kZW1vLWFuZC10ZXN0LWtleS1uZXZlci11c2UtaW4tcHJvZHVjdGlvbg==}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-DemoOnly-ChangeMe-2026}
    ports:
      - "8080:8080"
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
